    # For /service/tenantadmin/1: $1="/", $2="1" -> /tenantadmin/1
    nginx.ingress.kubernetes.io/rewrite-target: /tenantadmin$1$2
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
