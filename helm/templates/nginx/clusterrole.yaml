# ClusterRole and ClusterRoleBinding for ingress-nginx have been moved to
# ORISO-Infra/bootstrap/manifests/ingress-nginx-rbac.yaml
#
# Reason: ClusterRole and ClusterRoleBinding are cluster-scoped resources.
# Developer kubeconfigs have namespace-admin access only and cannot create
# them. Moving these to bootstrap lets developers deploy this chart with
# their own credentials.
#
# The ingress-nginx ServiceAccount (namespace-scoped) remains in
# helm/templates/nginx/serviceaccount.yaml.
