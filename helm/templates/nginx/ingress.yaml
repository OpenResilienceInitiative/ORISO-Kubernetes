apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - {{ .Values.global.domainName }}
        - {{ .Values.global.acmedomainName }}
      secretName: {{ .Values.global.domainName | replace "." "-" }}-tls
  rules:
    - host: {{ .Values.global.domainName }}
      http:
        paths:
          # AgencyService
          - path: /service/(agencies|agencyadmin)(.*)
            pathType: Prefix
            backend:
              service:
                name: agencyservice
                port:
                  number: 8080

          # ConsultingTypeService
          - path: /service/(consultingtypes|consultingtypeadmin|topic|settings)(.*)
            pathType: Prefix
            backend:
              service:
                name: consultingtypeservice
                port:
                  number: 8080

          # Frontend - error/static/public
          - path: /(error.400.html|static|public)
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080

          # Frontend - root (no regex, catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080

          # Keycloak - root
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          # Frontend - root (no regex, catch-all)
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 8080

          # Userservice
          - path: /service/(users|conversations|liveproxy|useradmin|appointments)(.*)
            pathType: Prefix
            backend:
              service:
                name: userservice
                port:
                  number: 8080