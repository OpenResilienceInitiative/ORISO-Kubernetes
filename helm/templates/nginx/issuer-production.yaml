# ClusterIssuer for Let's Encrypt has been moved to
# ORISO-Infra/bootstrap/manifests/letsencrypt-issuer.yaml
#
# Reason: ClusterIssuer is a cluster-scoped cert-manager resource.
# Developer kubeconfigs have namespace-admin access only and cannot create
# or get cluster-scoped resources. Moving it to bootstrap lets developers
# deploy this chart with their own credentials.
#
# The ClusterIssuer is applied by bootstrap.sh step 7 (after cert-manager
# is installed in step 3 and its CRDs are ready).
