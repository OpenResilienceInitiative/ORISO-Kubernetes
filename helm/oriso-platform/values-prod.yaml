# =====================================================================
# Per-service umbrella config (ingress, autoscaling, env extras)
# =====================================================================
services:
  userservice:
    ingress:
      host: api.oriso.org
      paths:
        - path: /service/users/sessions
          pathType: Prefix
        - path: /service/users
          pathType: Prefix
        - path: /service/matrix
          pathType: Prefix
        - path: /service/conversations
          pathType: Prefix
        - path: /service/useradmin
          pathType: Prefix
        - path: /service/messages
          pathType: Prefix
    autoscaling:
      enabled: false
      targetCPUUtilizationPercentage: 70
  tenantservice:
    ingress:
      host: api.oriso.org
      paths:
        - path: /service/tenant
          pathType: Prefix
        - path: /service/tenantadmin
          pathType: Prefix
        - path: /tenant
          pathType: Prefix
    autoscaling:
      enabled: false

  agencyservice:
    ingress:
      host: api.oriso.org
      paths:
        - path: /service/agencies
          pathType: Prefix
        - path: /service/agencyadmin
          pathType: Prefix
        - path: /service/topicadmin
          pathType: Prefix
        - path: /service/appointmentservice
          pathType: Prefix
    autoscaling:
      enabled: false
    env:
      FEATURE_TOPICS_ENABLED: "true"

  consultingtypeservice:
    ingress:
      host: api.oriso.org
      paths:
        - path: /service/consultingtypes
          pathType: Prefix
        - path: /service/settings
          pathType: Prefix
    autoscaling:
      enabled: false

  frontend:
    service:
      port: 9001
    ingress:
      host: app.oriso.org
    autoscaling:
      enabled: false

  admin:
    service:
      port: 9000
    ingress:
      host: admin.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  health-dashboard:
    enabled: true
    service:
      port: 9100
    ingress:
      enabled: true
      host: health.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  keycloak:
    enabled: true
    service:
      port: 8080
    ingress:
      enabled: true
      host: auth.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false


  matrix-synapse:
    enabled: true
    service:
      port: 8008
    ingress:
      enabled: true
      host: matrix.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  status-page:
    enabled: true
    service:
      port: 9200
    ingress:
      enabled: true
      host: status.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  storybook:
    enabled: true
    service:
      port: 80
    ingress:
      enabled: true
      host: storybook.oriso.org
      paths:
        - path: /
          pathType: Prefix
    autoscaling:
      enabled: false
