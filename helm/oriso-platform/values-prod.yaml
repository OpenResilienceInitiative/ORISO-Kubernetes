# =====================================================================
# ORISO Platform – Production values
# =====================================================================
# All environment-specific configuration lives here.
# Templates read from `global.*` so no URLs/hostnames live in subchart
# values.yaml files. Change a hostname here and the whole stack follows.
# =====================================================================
global:
  environment: prod
  namespace: caritas
  domain: oriso.org
  # Container registry prefix. Leave empty if image.repository values
  # already contain the full registry path (they do for ghcr.io images).
  imageRegistry: ""
  imagePullSecrets: []
  # Storage class used by PVCs created by this chart.
  storageClass: local-path
  # ----- Public hostnames -----------------------------------------
  domains:
    api: api.oriso.org
    app: app.oriso.org
    admin: admin.oriso.org
    auth: auth.oriso.org
    matrix: matrix.oriso.org
    call: call.oriso.org
    livekit: livekit.oriso.org
    storybook: storybook.oriso.org
    status: status.oriso.org
    health: health.oriso.org
  # ----- Internal cluster URLs ------------------------------------
  services:
    userservice:
      url: http://oriso-platform-userservice.caritas.svc.cluster.local:8082
      host: oriso-platform-userservice.caritas.svc.cluster.local
      port: 8082
    tenantservice:
      url: http://oriso-platform-tenantservice.caritas.svc.cluster.local:8081
      host: oriso-platform-tenantservice.caritas.svc.cluster.local
      port: 8081
    agencyservice:
      url: http://oriso-platform-agencyservice.caritas.svc.cluster.local:8084
      host: oriso-platform-agencyservice.caritas.svc.cluster.local
      port: 8084
    consultingtypeservice:
      url: http://oriso-platform-consultingtypeservice.caritas.svc.cluster.local:8083
      host: oriso-platform-consultingtypeservice.caritas.svc.cluster.local
      port: 8083
    mariadb:
      host: oriso-platform-mariadb.caritas.svc.cluster.local
      port: 3306
    mongodb:
      host: oriso-platform-mongodb.caritas.svc.cluster.local
      port: 27017
      uri: mongodb://oriso-platform-mongodb.caritas.svc.cluster.local:27017
    redis:
      host: oriso-platform-redis.caritas.svc.cluster.local
      port: 6379
    rabbitmq:
      host: oriso-platform-rabbitmq.caritas.svc.cluster.local
      port: 5672
    signoz:
      url: http://oriso-platform-signoz.caritas.svc.cluster.local:8080
      host: oriso-platform-signoz.caritas.svc.cluster.local
      port: 8080
    otelCollector:
      url: http://oriso-platform-otel-collector.caritas.svc.cluster.local:4318
      grpcUrl: http://oriso-platform-otel-collector.caritas.svc.cluster.local:4317
      host: oriso-platform-otel-collector.caritas.svc.cluster.local
    clickhouse:
      host: oriso-platform-clickhouse.caritas.svc.cluster.local
      port: 9000
      httpPort: 8123
    rocketchat:
      baseUrl: "http://oriso-platform-rocketchat.caritas.svc.cluster.local:3000/api/v1"
      mongoUrl: "mongodb://oriso-platform-mongodb.caritas.svc.cluster.local:27017/rocketchat?retryWrites=false"        
  # ----- Matrix Synapse -------------------------------------------
  matrix:
    serverName: oriso.org
    internalUrl: http://oriso-platform-matrix-synapse.caritas.svc.cluster.local:8008
    publicUrl: https://matrix.oriso.org
  # ----- Keycloak -------------------------------------------------
  keycloak:
    realm: online-beratung
    internalUrl: http://oriso-platform-keycloak.caritas.svc.cluster.local:8080
    publicUrl: https://auth.oriso.org
    jwt:
      issuerUri: https://auth.oriso.org/realms/online-beratung
      jwkSetUri: https://auth.oriso.org/realms/online-beratung/protocol/openid-connect/certs
  # ----- Ingress (shared by all services) -------------------------
  ingress:
    className: traefik
    tls:
      enabled: true
      secretName: wildcard-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"

namespace:
  create: false

# ----- Secrets ----------------------------------------------------
externalSecrets:
  enabled: false
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore

bootstrapSecrets:
  enabled: true
  mariadb:
    rootPassword: "CHANGE_ME_ROOT_PASSWORD"
    database: "oriso"
    user: "oriso"
    password: "CHANGE_ME_DB_PASSWORD"
  rabbitmq:
    user: "admin"
    password: "CHANGE_ME_RABBITMQ_PASSWORD"
  redis:
    password: "CHANGE_ME_REDIS_PASSWORD"

bootstrapPvc:
  enabled: true
  storageClass: local-path
  mongodb:
    size: 20Gi
  redis:
    size: 10Gi
  matrix:
    size: 20Gi

# =====================================================================
# Subchart dependency configuration (images, enablement)
# =====================================================================
mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "10.11"
    pullPolicy: IfNotPresent
  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1;'
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

