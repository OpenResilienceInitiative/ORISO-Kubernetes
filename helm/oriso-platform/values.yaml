global:
  namespace: oriso
  environment: dev
  domain: oriso.org
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: managed-csi
  ingress:
    className: nginx
    tls:
      enabled: true
      secretName: wildcard-tls

namespace:
  create: true

externalSecrets:
  enabled: false
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore

# Bootstrap Secrets (rendered by templates/secrets/bootstrap-secrets.yaml).
# Disabled by default so a vanilla `helm install` doesn't create empty Secrets;
# enable via values-<env>.yaml and provide real credentials there.
bootstrapSecrets:
  enabled: false
  mariadb:
    rootPassword: ""
    database: ""
    user: ""
    password: ""
  rabbitmq:
    user: ""
    password: ""
  redis:
    password: ""

# Bootstrap PVCs (rendered by templates/pvc/bootstrap-pvc.yaml).
# Disabled by default so the chart works on clusters without the local-path provisioner.
bootstrapPvc:
  enabled: false
  storageClass: ""
  mongodb:
    size: 10Gi
  redis:
    size: 1Gi
  matrix:
    size: 10Gi

# Single place to manage dependency enablement and images used by subcharts.
mariadb:
  enabled: true
  image: { repository: mariadb, tag: "10.11", pullPolicy: IfNotPresent }
mongodb:
  enabled: true
  image: { repository: mongo, tag: "5.0", pullPolicy: IfNotPresent }
redis:
  enabled: true
  image: { repository: redis, tag: "7-alpine", pullPolicy: IfNotPresent }
  # redis.conf settings rendered into the redis-config ConfigMap.
  config:
    bind: "0.0.0.0"
    protectedMode: "no"
    appendonly: "yes"
rabbitmq:
  enabled: true
  image: { repository: rabbitmq, tag: "3-management", pullPolicy: IfNotPresent }
keycloak:
  enabled: true
  image: { repository: quay.io/keycloak/keycloak, tag: "20.0.5", pullPolicy: IfNotPresent }
matrix-synapse:
  enabled: true
  image: { repository: matrixdotorg/synapse, tag: latest, pullPolicy: Always }
element:
  enabled: false
  image: { repository: ghcr.io/openresilienceinitiative/oriso-element, tag: rebuild, pullPolicy: Never }
element-call:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/element-call, tag: rebuild, pullPolicy: Never }
livekit:
  enabled: true
  livekit:
    image: { repository: livekit/livekit-server, tag: latest, pullPolicy: IfNotPresent }
  tokenService:
    image: { repository: ghcr.io/openresilienceinitiative/livekit-token-service, tag: rebuild, pullPolicy: Never }
tenantservice:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/oriso-tenantservice, tag: rebuild, pullPolicy: IfNotPresent }
userservice:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/oriso-userservice, tag: rebuild, pullPolicy: IfNotPresent }
agencyservice:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/oriso-agencyservice, tag: rebuild, pullPolicy: IfNotPresent }
  features:
    topics:
      enabled: true
consultingtypeservice:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/oriso-consultingtypeservice, tag: rebuild, pullPolicy: IfNotPresent }
frontend:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/caritas-frontend, tag: rebuild, pullPolicy: Never }
admin:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/caritas-admin, tag: rebuild, pullPolicy: IfNotPresent }
clickhouse:
  enabled: true
  image: { repository: clickhouse/clickhouse-server, tag: "23.8", pullPolicy: IfNotPresent }
redis-commander:
  enabled: true
  image: { repository: rediscommander/redis-commander, tag: latest, pullPolicy: Always }
redis-exporter:
  enabled: true
  image: { repository: oliver006/redis_exporter, tag: latest, pullPolicy: Always }
status-page:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/oriso-status, tag: rebuild, pullPolicy: Never }
health-dashboard:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/health-dashboard, tag: rebuild, pullPolicy: Never }
storybook:
  enabled: true
  image: { repository: ghcr.io/openresilienceinitiative/caritas-storybook, tag: rebuild, pullPolicy: Never }
signoz:
  enabled: true
  image: { repository: signoz/signoz, tag: "v0.105.1", pullPolicy: IfNotPresent }
otel-collector:
  enabled: true
  image: { repository: otel/opentelemetry-collector, tag: "0.100.0", pullPolicy: IfNotPresent }
service-health-exporter:
  enabled: true
  image: { repository: python, tag: "3.11-slim", pullPolicy: IfNotPresent }

services:
  userservice:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/oriso-userservice, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8082 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /api/users
        pathType: Prefix
      - path: /api/conversations
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 80 }
    probes:
      liveness: { path: /actuator/health/liveness, port: 8082 }
      readiness: { path: /actuator/health/readiness, port: 8082 }
    env:
      DB_HOST: oriso-platform-mariadb
      DB_PORT: "3306"
    secret:
      existingSecret: userservice-secret
      externalSecret:
        enabled: false
        data: []

  tenantservice:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/oriso-tenantservice, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8081 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /api/tenant
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false }
    probes:
      liveness: { path: /actuator/health/liveness, port: 8081 }
      readiness: { path: /actuator/health/readiness, port: 8081 }
    env: {}
    secret:
      existingSecret: tenantservice-secret
      externalSecret: { enabled: false, data: [] }

  agencyservice:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/oriso-agencyservice, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8084 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /api/agencies
        pathType: Prefix
      - path: /api/agencyadmin
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false }
    probes:
      liveness: { path: /actuator/health/liveness, port: 8084 }
      readiness: { path: /actuator/health/readiness, port: 8084 }
    env:
      FEATURE_TOPICS_ENABLED: "true"
    secret:
      existingSecret: agencyservice-secret
      externalSecret: { enabled: false, data: [] }

  consultingtypeservice:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/oriso-consultingtypeservice, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8083 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /api/consultingtypes
        pathType: Prefix
      - path: /api/settings
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false }
    probes:
      liveness: { path: /actuator/health/liveness, port: 8083 }
      readiness: { path: /actuator/health/readiness, port: 8083 }
    env: {}
    secret:
      existingSecret: consultingtypeservice-secret
      externalSecret: { enabled: false, data: [] }

  frontend:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/caritas-frontend, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8080 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false }
    probes:
      liveness: { path: /, port: 8080 }
      readiness: { path: /, port: 8080 }
    env: {}
    secret:
      existingSecret: frontend-secret
      externalSecret: { enabled: false, data: [] }

  admin:
    enabled: true
    replicaCount: 2
    image: { repository: ghcr.io/openresilienceinitiative/caritas-admin, tag: rebuild, pullPolicy: IfNotPresent }
    service: { port: 8080 }
    ingress:
      enabled: true
      annotations: {}
      paths:
      - path: /admin
        pathType: Prefix
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling: { enabled: false }
    probes:
      liveness: { path: /, port: 8080 }
      readiness: { path: /, port: 8080 }
    env: {}
    secret:
      existingSecret: admin-secret
      externalSecret: { enabled: false, data: [] }
