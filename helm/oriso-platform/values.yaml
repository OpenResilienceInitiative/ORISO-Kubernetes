# =====================================================================
# Per-service umbrella config (ingress, autoscaling, env extras)
# =====================================================================
services:
  userservice:
    service:
      port: 8082
    ingress:
      host: api.oriso.org
      paths:
        - name: users-sessions
          path: /service/users/sessions(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /users/sessions/$2
        - name: users
          path: /service/users(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /users/$2
        - name: users-live
          path: /service/live(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /live/$2
        - name: users-matrix
          path: /service/matrix(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /matrix/$2
        - name: users-conversations
          path: /service/conversations(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /conversations/$2
        - name: users-useradmin
          path: /service/useradmin(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /useradmin/$2
        - name: users-messages
          path: /service/messages(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /messages/$2
    autoscaling:
      enabled: false
      targetCPUUtilizationPercentage: 70

  tenantservice:
    service:
      port: 8081
    ingress:
      host: api.oriso.org
      paths:
        - name: tenant-access
          path: /service/tenant/access
          pathType: Exact
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /tenant/access
            nginx.ingress.kubernetes.io/use-regex: "true"
        - name: tenant-numeric
          path: /service/tenant/([0-9]+)(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /tenant/$1$2$3
        - name: tenant-public
          path: /service/tenant/public/(.+)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /tenant/public/$1
        - name: tenant-public-root
          path: /service/tenant/public/
          pathType: Exact
          annotations:
            nginx.ingress.kubernetes.io/rewrite-target: /tenant/public/caritas-berlin
        - name: tenant
          path: /tenant(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /tenant/$2
        - name: tenantadmin
          path: /service/tenantadmin(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /tenantadmin$1$2
    autoscaling:
      enabled: false

  agencyservice:
    service:
      port: 8084
    ingress:
      host: api.oriso.org
      paths:
        - name: agencies
          path: /service/agencies(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /agencyadmin/$2
        - name: agencyadmin
          path: /service/agencyadmin(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /agencyadmin/$2
        - name: topicadmin
          path: /service/topicadmin(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
        - name: appointmentservice
          path: /service/appointmentservice(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
    autoscaling:
      enabled: false
    env:
      FEATURE_TOPICS_ENABLED: "true"

  consultingtypeservice:
    service:
      port: 8083
    ingress:
      host: api.oriso.org
      paths:
        - name: consultingtypes
          path: /service/consultingtypes(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /consultingtypes/$2
        - name: settings
          path: /service/settings(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /settings
        - name: settingsadmin
          path: /service/settingsadmin(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /settingsadmin
        - name: topic-groups
          path: /service/topic-groups(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /topic-groups/$2
        - name: topic
          path: /service/topic(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /topic/$2
    autoscaling:
      enabled: false

  element-call:
    enabled: true
    service:
      port: 80
    ingress:
      enabled: true
      host: call.oriso.org
      paths:
        - name: element-call-config
          path: /config.json
          pathType: Exact
        - name: element-call-root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  frontend:
    service:
      port: 9001
    ingress:
      host: app.oriso.org
      paths:
        - name: frontend-root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  keycloak:
    enabled: true
    service:
      port: 8080
    ingress:
      enabled: true
      host: auth.oriso.org
      backendServiceName: oriso-keycloak
      paths:
        - name: root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  health-dashboard:
    enabled: true
    service:
      port: 9100
    ingress:
      enabled: true
      host: health.oriso.org
      backendServiceName: oriso-health-dashboard
      paths:
        - name: root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  matrix-synapse:
    enabled: true
    service:
      port: 8008
    ingress:
      enabled: true
      host: matrix.oriso.org
      backendServiceName: oriso-matrix-synapse
      paths:
        - name: root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  keycloak-api:
    enabled: true
    service:
      port: 8080
    ingress:
      enabled: true
      host: api.oriso.org
      backendServiceName: oriso-keycloak
      paths:
        - name: auth
          path: /auth(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /$2

  health-api:
    enabled: true
    service:
      port: 9100
    ingress:
      enabled: true
      host: api.oriso.org
      backendServiceName: oriso-health-dashboard
      paths:
        - name: health
          path: /health(/|$)(.*)
          pathType: ImplementationSpecific
          annotations:
            nginx.ingress.kubernetes.io/use-regex: "true"
            nginx.ingress.kubernetes.io/rewrite-target: /$2

  matrix-api:
    enabled: true
    service:
      port: 8008
    ingress:
      enabled: true
      host: api.oriso.org
      backendServiceName: oriso-matrix-synapse
      paths:
        - name: media
          path: /_matrix/media(/|$)(.*)
          pathType: ImplementationSpecific
        - name: wk-client
          path: /.well-known/matrix/client
          pathType: ImplementationSpecific
        - name: wk-server
          path: /.well-known/matrix/server
          pathType: ImplementationSpecific

  admin:
    service:
      port: 9000
    ingress:
      host: admin.oriso.org
      paths:
        - name: admin-root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  status-page:
    enabled: true
    service:
      port: 9200
    ingress:
      enabled: true
      host: status.oriso.org
      paths:
        - name: status-root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false

  storybook:
    enabled: true
    service:
      port: 80
    ingress:
      enabled: true
      host: storybook.oriso.org
      paths:
        - name: storybook-root
          path: /
          pathType: Prefix
    autoscaling:
      enabled: false
