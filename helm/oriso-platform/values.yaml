# =====================================================================
# ORISO Platform – Production values
# =====================================================================
# All environment-specific configuration lives here.
# Templates read from `global.*` so no URLs/hostnames live in subchart
# values.yaml files. Change a hostname here and the whole stack follows.
# =====================================================================
global:
  environment: prod
  namespace: caritas
  domain: oriso.org
  # Container registry prefix. Leave empty if image.repository values
  # already contain the full registry path (they do for ghcr.io images).
  imageRegistry: ""
  imagePullSecrets: []
  # Storage class used by PVCs created by this chart.
  storageClass: local-path
  # ----- Public hostnames -----------------------------------------
  domains:
    api: api.oriso.org
    app: app.oriso.org
    admin: admin.oriso.org
    auth: auth.oriso.org
    matrix: matrix.oriso.org
    call: call.oriso.org
    livekit: livekit.oriso.org
    storybook: storybook.oriso.org
    status: status.oriso.org
    health: health.oriso.org
  # ----- Internal cluster URLs ------------------------------------
  services:
    userservice:
      url: http://oriso-userservice.caritas.svc.cluster.local:8082
      host: oriso-userservice.caritas.svc.cluster.local
      port: 8082
    tenantservice:
      url: http://oriso-tenantservice.caritas.svc.cluster.local:8081
      host: oriso-tenantservice.caritas.svc.cluster.local
      port: 8081
    agencyservice:
      url: http://oriso-agencyservice.caritas.svc.cluster.local:8084
      host: oriso-agencyservice.caritas.svc.cluster.local
      port: 8084
    consultingtypeservice:
      url: http://oriso-consultingtypeservice.caritas.svc.cluster.local:8083
      host: oriso-consultingtypeservice.caritas.svc.cluster.local
      port: 8083
    mariadb:
      host: oriso-mariadb.caritas.svc.cluster.local
      port: 3306
    mongodb:
      host: oriso-mongodb.caritas.svc.cluster.local
      port: 27017
      uri: mongodb://oriso-mongodb.caritas.svc.cluster.local:27017
    redis:
      host: oriso-redis.caritas.svc.cluster.local
      port: 6379
    rabbitmq:
      host: oriso-rabbitmq.caritas.svc.cluster.local
      port: 5672
    signoz:
      url: http://oriso-signoz.caritas.svc.cluster.local:4317
      host: oriso-signoz.caritas.svc.cluster.local
      port: 4317
    otelCollector:
      url: http://oriso-otel-collector.caritas.svc.cluster.local:4318
      grpcUrl: http://oriso-otel-collector.caritas.svc.cluster.local:4317
      host: oriso-otel-collector.caritas.svc.cluster.local
    clickhouse:
      host: oriso-clickhouse.caritas.svc.cluster.local
      port: 9000
      httpPort: 8123
    rocketchat:
      baseUrl: "http://oriso-rocketchat.caritas.svc.cluster.local:3000/api/v1"
      mongoUrl: "mongodb://oriso-mongodb.caritas.svc.cluster.local:27017/rocketchat?retryWrites=false"        
  # ----- Matrix Synapse -------------------------------------------
  matrix:
    serverName: oriso.org
    internalUrl: http://oriso-matrix-synapse.caritas.svc.cluster.local:8008
    publicUrl: https://matrix.oriso.org
  # ----- Keycloak -------------------------------------------------
  keycloak:
    realm: online-beratung
    internalUrl: http://oriso-keycloak.caritas.svc.cluster.local:8080
    publicUrl: https://auth.oriso.org
    jwt:
      issuerUri: "https://auth.oriso.org/realms/online-beratung"
      jwkSetUri: "http://oriso-keycloak.caritas.svc.cluster.local:8080/realms/online-beratung/protocol/openid-connect/certs"
  # ----- Ingress (shared by all services) -------------------------
  ingress:
    className: nginx
    tls:
      enabled: true
      secretName: wildcard-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.oriso.org,https://admin.oriso.org"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type,Cache-Control,Pragma,Expires,X-CSRF-Token,x-csrf-token,X-Requested-With,X-WHITELIST-HEADER,rctoken"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
      nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"


namespace:
  create: false

# ----- Secrets ----------------------------------------------------
externalSecrets:
  enabled: false
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore

bootstrapSecrets:
  enabled: true
  mariadb:
    rootPassword: "CHANGE_ME_ROOT_PASSWORD"
    database: "oriso"
    user: "oriso"
    password: "CHANGE_ME_DB_PASSWORD"
  rabbitmq:
    user: "admin"
    password: "CHANGE_ME_RABBITMQ_PASSWORD"
  redis:
    password: "CHANGE_ME_REDIS_PASSWORD"

bootstrapPvc:
  enabled: true
  storageClass: local-path
  mongodb:
    size: 20Gi
  redis:
    size: 10Gi
  matrix:
    size: 20Gi

# =====================================================================
# Subchart dependency configuration (images, enablement)
# =====================================================================
mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "10.11"
    pullPolicy: IfNotPresent
  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1;'
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent

redis:
  enabled: true
  image:
    repository: ghcr.io/openresilienceinitiative/oriso-redis
    tag: latest
    pullPolicy: IfNotPresent

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.12-management"
    pullPolicy: IfNotPresent

keycloak:
  enabled: true
  hostNetwork: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "20.0.5"
    pullPolicy: IfNotPresent

  keycloak:
    args:
      - start
    hostname: auth.oriso.org
    hostnameStrictHttps: true
    httpEnabled: true
    proxy: edge
    admin:
      username: admin
      password: admin
    env:
      KC_SPI_STICKY_SESSION_ENCODER_INFINISPAN_SHOULD_ATTACH_ROUTE: "false"
      KC_DB: mariadb
      KC_DB_URL_HOST: oriso-mariadb.caritas.svc.cluster.local
      KC_DB_URL_PORT: "3306"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"


matrix-synapse:
  enabled: true
  image:
    repository: matrixdotorg/synapse
    tag: latest
    pullPolicy: IfNotPresent

element:
