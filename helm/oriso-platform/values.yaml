# ORISO Platform Master Chart - Values
# This chart deploys the complete ORISO platform
# All sub-charts inherit global values from ../values.yaml

# Global values (inherited from parent values.yaml)
# These are passed to all sub-charts
global:
  namespace: "caritas"
  domains:
    api: "api.oriso.org"
    app: "app.oriso.org"
    admin: "admin.oriso.org"
    auth: "auth.oriso.org"
    matrix: "matrix.oriso.org"
    element: "element.oriso.org"
    call: "call.oriso.org"
    livekit: "livekit.oriso.org"
    health: "health.oriso.org"
    status: "status.oriso.org"
    redis: "redis.oriso.org"
    signoz: "signoz.oriso.org"
    storybook: "storybook.oriso.org"
  keycloak:
    internalUrl: "http://oriso-platform-keycloak.caritas.svc.cluster.local:8080"
    externalUrl: "https://auth.oriso.org"
    realm: "online-beratung"
    jwt:
      issuerUri: "https://auth.oriso.org/realms/online-beratung"
      jwkSetUri: "https://auth.oriso.org/realms/online-beratung/protocol/openid-connect/certs"
  matrix:
    serverName: "oriso.org"
    internalUrl: "http://oriso-platform-matrix-synapse.caritas.svc.cluster.local:8008"
    externalUrl: "https://matrix.oriso.org"
    registrationSharedSecret: "caritas-registration-secret-2025"
  cors:
    allowedOrigins:
      - "https://app.oriso.org"
      - "https://admin.oriso.org"
      - "https://api.oriso.org"
  databases:
    mariadb:
      host: "oriso-platform-mariadb.caritas.svc.cluster.local"
      port: 3306
    mongodb:
      host: "oriso-platform-mongodb.caritas.svc.cluster.local"
      port: 27017
    redis:
      host: "oriso-platform-redis.caritas.svc.cluster.local"
      port: 6379
    rabbitmq:
      host: "oriso-platform-rabbitmq.caritas.svc.cluster.local"
      port: 5672
      managementPort: 15672
  services:
    agencyservice:
      url: "http://oriso-platform-agencyservice.caritas.svc.cluster.local:8084"
    userservice:
      url: "http://oriso-platform-userservice.caritas.svc.cluster.local:8082"
    tenantservice:
      url: "http://oriso-platform-tenantservice.caritas.svc.cluster.local:8081"
    consultingtypeservice:
      url: "http://oriso-platform-consultingtypeservice.caritas.svc.cluster.local:8083"

# Enable/Disable Services
# Set to false to skip deployment of a service

# Infrastructure (Deploy First)
mariadb:
  enabled: true
mongodb:
  enabled: true
redis:
  enabled: true
rabbitmq:
  enabled: true

# Authentication & Communication
keycloak:
  enabled: true
matrix-synapse:
  enabled: true
element:
  enabled: false  # Image not available - disable for now
element-call:
  enabled: true

# WebRTC
livekit:
  enabled: true

# Backend Services
tenantservice:
  enabled: true
  features:
    multitenancy:
      enabled: true
      withSingleDomain:
        enabled: true
userservice:
  enabled: true
  features:
    multitenancy:
      enabled: true
      withSingleDomain:
        enabled: true
  smtp:
    host: "smtp.titan.email"
    port: "587"
    secure: "false"
    user: ""
    password: ""
    from: "ORISO <notifications@oriso.org>"
agencyservice:
  enabled: true
  features:
    multitenancy:
      enabled: true
      withSingleDomain:
        enabled: true
consultingtypeservice:
  enabled: true
  features:
    multitenancy:
      enabled: false
      withSingleDomain:
        enabled: true
      mainTenantSubdomain: "caritas-berlin"

# Frontend Services
frontend:
  enabled: true
admin:
  enabled: true

# Monitoring & Utilities
clickhouse:
  enabled: true
redis-commander:
  enabled: true
redis-exporter:
  enabled: true
status-page:
  enabled: true
health-dashboard:
  enabled: true
storybook:
  enabled: true
signoz:
  enabled: true
otel-collector:
  enabled: true
service-health-exporter:
  enabled: true

