# =====================================================================
# values-prod-secrets.yaml — LOCAL / LINT / DEV-TEST ONLY
# =====================================================================
# Throwaway placeholder credentials so `helm lint` and `helm template`
# can render the chart end-to-end.
#
# Structure matches `templates/secrets/bootstrap-secrets.yaml` exactly:
# this file populates:
#   - Secret/mariadb-secrets (MYSQL_ROOT_PASSWORD, MYSQL_DATABASE,
#                             MYSQL_USER, MYSQL_PASSWORD)
#   - Secret/rabbitmq-secrets (RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS)
#   - Secret/redis-secret    (password, REDIS_PASSWORD)
#
# IMPORTANT:
#   - Do NOT commit this file to git (already in .gitignore).
#   - Do NOT use these values in a real production cluster.
#   - For real prod, rotate every value to a 24+ char random string
#     and ideally source from External Secrets Operator / Sealed
#     Secrets / SOPS instead of a values file.
# =====================================================================

