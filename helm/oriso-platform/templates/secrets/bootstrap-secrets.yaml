{{- if .Values.bootstrapSecrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secrets
  namespace: {{ include "oriso-platform.namespace" . }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.bootstrapSecrets.mariadb.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.bootstrapSecrets.mariadb.database | quote }}
  MYSQL_USER: {{ .Values.bootstrapSecrets.mariadb.user | quote }}
  MYSQL_PASSWORD: {{ .Values.bootstrapSecrets.mariadb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: {{ include "oriso-platform.namespace" . }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.bootstrapSecrets.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.bootstrapSecrets.rabbitmq.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: {{ include "oriso-platform.namespace" . }}
type: Opaque
stringData:
  # Redis server auth (consumed by redis, app services, redis-exporter)
  password: {{ .Values.bootstrapSecrets.redis.password | quote }}
  REDIS_PASSWORD: {{ .Values.bootstrapSecrets.redis.password | quote }}
  # redis-commander web UI login (separate from redis server auth)
  HTTP_USER: {{ default "admin" .Values.bootstrapSecrets.redis.httpUser | quote }}
  HTTP_PASSWORD: {{ default .Values.bootstrapSecrets.redis.password .Values.bootstrapSecrets.redis.httpPassword | quote }}
{{- end }}


