{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $secret := default (dict) $svc.secret }}
{{- $ext := default (dict) $secret.externalSecret }}
{{- if and $svc.enabled (default false $ext.enabled) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "oriso-platform.serviceName" (dict "Release" $.Release "service" $name) }}
  namespace: {{ include "oriso-platform.namespace" $ }}
  labels:
    {{- include "oriso-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  refreshInterval: {{ default "1h" $ext.refreshInterval }}
  secretStoreRef:
    name: {{ default $.Values.externalSecrets.secretStoreRef.name $ext.secretStoreRef.name }}
    kind: {{ default $.Values.externalSecrets.secretStoreRef.kind $ext.secretStoreRef.kind }}
  target:
    name: {{ default (printf "%s-secret" (include "oriso-platform.serviceName" (dict "Release" $.Release "service" $name))) $secret.existingSecret }}
  data:
  {{- range $item := (default (list) $ext.data) }}
  - secretKey: {{ $item.secretKey }}
    remoteRef:
      key: {{ $item.remoteRef.key }}
      property: {{ $item.remoteRef.property }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

