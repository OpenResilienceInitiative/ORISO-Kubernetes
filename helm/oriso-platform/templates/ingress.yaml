{{- range $name, $svc := .Values.services }}
{{- if and (default true $svc.enabled) (default true $svc.ingress.enabled) }}
{{- $host := default $.Values.global.domain $svc.ingress.host }}
{{- range $i, $p := $svc.ingress.paths }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s-ingress" $name (default (printf "path-%d" $i) $p.name) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "oriso-platform.namespace" $ }}
  labels:
    {{- include "oriso-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  {{- $globalAnnos := default dict $.Values.global.ingress.annotations }}
  {{- $svcAnnos := default dict $svc.ingress.annotations }}
  {{- $pathAnnos := default dict $p.annotations }}
  {{- $merged := merge (merge $pathAnnos $svcAnnos) $globalAnnos }}
  {{- if $merged }}
  annotations:
    {{- toYaml $merged | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.global.ingress.className }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $p.path }}
            pathType: {{ default "Prefix" $p.pathType }}
            backend:
              service:
                name: {{ default (include "oriso-platform.serviceName" (dict "Release" $.Release "service" $name)) $svc.ingress.backendServiceName }}
                port:
                  number: {{ $svc.service.port }}
  {{- if $.Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ $.Values.global.ingress.tls.secretName }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

