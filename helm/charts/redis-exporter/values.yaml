# Redis Exporter Helm Chart - Values
#
# IMPORTANT: chart defaults only. Production Redis address is supplied
# from the umbrella via .Values.global.services.redis.* and consumed
# by the templates with that as preferred source.

image:
  repository: oliver006/redis_exporter
  tag: "latest"
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

service:
  type: ClusterIP
  port: 9121
  targetPort: 9121

# Redis Configuration. Templates derive `addr` from global.services.redis.*;
# falls back to .Values.redis.host:port if global isn't set.
redis:
  host: ""
  port: 6379
  # Optional explicit override; if empty, addr is built as host:port.
  addr: ""
  secret:
    name: redis-secret
    key: password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
