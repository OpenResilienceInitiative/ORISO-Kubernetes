apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-exporter.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "redis-exporter.labels" . | nindent 4 }}
    app: redis-exporter
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: redis-exporter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: REDIS_ADDR
          {{- $gRedis := default dict (default dict (.Values.global | default dict).services).redis -}}
          {{- $rHost := default .Values.redis.host (default "" $gRedis.host) -}}
          {{- $rPort := default .Values.redis.port (default 0 $gRedis.port) -}}
          {{- $finalAddr := .Values.redis.addr -}}
          {{- if and (eq $finalAddr "") (ne $rHost "") -}}
          {{- $finalAddr = printf "%s:%v" $rHost $rPort -}}
          {{- end }}
          value: {{ $finalAddr | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.secret.name }}
              key: {{ .Values.redis.secret.key }}
        ports:
        - name: metrics
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      terminationGracePeriodSeconds: 30



