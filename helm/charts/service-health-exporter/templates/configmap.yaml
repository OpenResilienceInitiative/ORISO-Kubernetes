{{- /*
Service Health Exporter ConfigMap.
OTEL endpoint and service URLs come from .Values.global.services.* when set.
*/ -}}
{{- $gSvc      := default dict (.Values.global | default dict).services -}}
{{- $gOtel     := default dict $gSvc.otelCollector -}}
{{- $otelUrl   := default .Values.otel.endpoint (default "" $gOtel.url) -}}
{{- $exporter  := default dict .Values.exporter -}}
{{- $svcName   := default "oriso-health-monitor" $exporter.serviceName -}}
{{- $meterName := default "oriso.monitoring"     $exporter.meterName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-health-exporter.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "service-health-exporter.labels" . | nindent 4 }}
data:
  service-health-exporter.py: |
    #!/usr/bin/env python3
    """
    ORISO Service Health Monitor - exports to SigNoz via OTEL Collector
    """
    import requests
    import time
    import os
    from opentelemetry import metrics
    from opentelemetry.sdk.metrics import MeterProvider
    from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader
    from opentelemetry.exporter.otlp.proto.http.metric_exporter import OTLPMetricExporter
    from opentelemetry.sdk.resources import Resource

    OTEL_ENDPOINT = os.getenv("OTEL_ENDPOINT", "{{ $otelUrl }}")
    CHECK_INTERVAL = int(os.getenv("CHECK_INTERVAL", "{{ .Values.monitoring.checkInterval }}"))
    TIMEOUT = int(os.getenv("TIMEOUT", "{{ .Values.monitoring.timeout }}"))
    print(f"Using OTEL endpoint: {OTEL_ENDPOINT}")

    resource = Resource.create({"service.name": "{{ $svcName }}"})
    # OTLP HTTP receiver expects /v1/metrics; the exporter does NOT
    # auto-append this path when endpoint is passed explicitly.
    _metrics_endpoint = OTEL_ENDPOINT.rstrip("/") + "/v1/metrics"
    exporter = OTLPMetricExporter(endpoint=_metrics_endpoint)
    reader = PeriodicExportingMetricReader(exporter, export_interval_millis=CHECK_INTERVAL * 1000)
    provider = MeterProvider(resource=resource, metric_readers=[reader])
    metrics.set_meter_provider(provider)

    meter = metrics.get_meter("{{ $meterName }}")

    service_up = meter.create_up_down_counter(
        "service.up",
        description="Service availability (1=up, 0=down)"
    )
    response_time = meter.create_histogram(
        "service.response_time",
        unit="ms",
        description="Service response time in milliseconds"
    )

    SERVICES = {
        {{- range $key, $value := .Values.services }}
        {{- $gUrl := "" -}}
        {{- if and $gSvc (index $gSvc $key) -}}
        {{- $gUrl = (index $gSvc $key).url -}}
        {{- end }}
        {{- $baseUrl := default $value.url $gUrl }}
        "{{ $key }}": {
            "url":  "{{ printf "%s%s" $baseUrl (default "/actuator/health" $value.path) }}",
            "port": {{ $value.port }}
        },
        {{- end }}
    }

    def check_service(name, config):
        try:
            start = time.time()
            response = requests.get(config["url"], timeout=TIMEOUT)
            duration = (time.time() - start) * 1000
            status = 1 if response.status_code == 200 else 0
            attributes = {
                "service.name": name,
                "service.port": str(config["port"]),
                "http.status_code": str(response.status_code)
            }
            service_up.add(status, attributes)
            response_time.record(duration, attributes)
            print(f"OK {name}: {response.status_code} ({duration:.2f}ms)")
        except Exception as e:
            attributes = {
                "service.name": name,
                "service.port": str(config["port"]),
                "error": "true"
            }
            service_up.add(0, attributes)
            print(f"DOWN {name}: {str(e)}")

    print("ORISO Health Monitor")
    print(f"Monitoring {len(SERVICES)} services -> {OTEL_ENDPOINT}")
    print("=" * 60)

    while True:
        for service_name, service_config in SERVICES.items():
            check_service(service_name, service_config)
        print("-" * 60)
        time.sleep(CHECK_INTERVAL)

