# Service Health Exporter Helm Chart - Values
#
# IMPORTANT: chart defaults only. Endpoints come from umbrella global.*.

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

# OTEL exporter target. Templates derive from
# .Values.global.services.otelCollector.url; falls back to value here only.
otel:
  endpoint: ""
  insecure: true

# Services to monitor. The template computes the URL as
# <global.services.<name>.url><path> and uses .url here as fallback.
services:
  tenantservice:
    url: ""
    path: "/actuator/health"
    port: 8081
  userservice:
    url: ""
    path: "/actuator/health"
    port: 8082
  consultingtypeservice:
    url: ""
    path: "/actuator/health"
    port: 8083
  agencyservice:
    url: ""
    path: "/actuator/health"
    port: 8084

monitoring:
  checkInterval: 10
  timeout: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Identifier strings used by the Python exporter / OTel resource attrs.
exporter:
  serviceName: "oriso-health-monitor"
  meterName:   "oriso.monitoring"
