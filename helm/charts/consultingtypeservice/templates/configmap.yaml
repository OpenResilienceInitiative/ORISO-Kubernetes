{{- /*
ConsultingTypeService ConfigMap.
URLs from .Values.global.* with fallback to chart values.
*/ -}}
{{- $g    := .Values.global | default dict -}}
{{- $gSvc := (default dict $g.services) -}}
{{- $gKc  := (default dict $g.keycloak) -}}
{{- $gJwt := (default dict $gKc.jwt) -}}
{{- $mariaHost := (default "" (get (default dict $gSvc.mariadb) "host")) -}}
{{- $mariaPort := (default 3306 (get (default dict $gSvc.mariadb) "port")) -}}
{{- $mongoUri  := (default "" (get (default dict $gSvc.mongodb) "uri")) -}}
{{- $rmqHost   := (default "" (get (default dict $gSvc.rabbitmq) "host")) -}}
{{- $rmqPort   := (default 5672 (get (default dict $gSvc.rabbitmq) "port")) -}}
{{- $tenantUrl := (default "" (get (default dict $gSvc.tenantservice) "url")) -}}
{{- $dbUrl     := default .Values.database.url (ternary (printf "jdbc:mariadb://%s:%v/consultingtypeservice" $mariaHost $mariaPort) "" (ne $mariaHost "")) -}}
{{- $mongoFull := default .Values.mongodb.uri  (ternary (printf "%s/consultingtypeservice" $mongoUri) "" (ne $mongoUri "")) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "consultingtypeservice.fullname" . }}-config
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "consultingtypeservice.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL:   {{ $dbUrl     | quote }}
  SPRING_DATA_MONGODB_URI: {{ $mongoFull | quote }}

  KEYCLOAK_AUTH_SERVER_URL: {{ default .Values.keycloak.authServerUrl $gKc.internalUrl | quote }}
  KEYCLOAK_REALM:           {{ default .Values.keycloak.realm          $gKc.realm | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:  {{ default .Values.keycloak.jwt.issuerUri  $gJwt.issuerUri  | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: {{ default .Values.keycloak.jwt.jwkSetUri $gJwt.jwkSetUri | quote }}

  SPRING_RABBITMQ_HOST: {{ (default .Values.rabbitmq.host $rmqHost) | quote }}
  SPRING_RABBITMQ_PORT: {{ $rmqPort | quote }}

  TENANT_SERVICE_API_URL: {{ default .Values.services.tenantService.apiUrl $tenantUrl | quote }}

  SPRING_PROFILES_ACTIVE: {{ .Values.spring.profiles.active | quote }}

  MULTITENANCY_ENABLED: {{ .Values.features.multitenancy.enabled | quote }}
  FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED: {{ .Values.features.multitenancy.withSingleDomain.enabled | quote }}
  SETTING_MAIN_TENANT_SUBDOMAIN_FOR_SINGLE_DOMAIN_MULTITENANCY: {{ .Values.features.multitenancy.mainTenantSubdomain | quote }}

  SPRING_LIQUIBASE_ENABLED: {{ .Values.database.liquibase.enabled | quote }}
