# ConsultingTypeService Helm Chart - Values
#
# IMPORTANT: chart defaults only. URLs come from umbrella global.*.

image:
  repository: ghcr.io/openresilienceinitiative/oriso-consultingtypeservice
  tag: rebuild
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

podLabels:
  tier: backend

resources:
  requests: {}
  limits: {}

livenessProbe: {}
readinessProbe: {}

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

database:
  url: ""
  username: ""
  password: ""
  driver: "org.mariadb.jdbc.Driver"
  liquibase:
    # Enabled so Spring Boot runs its bundled changesets on first boot
    # and creates the schema automatically in an empty database.
    enabled: false

mongodb:
  uri: ""

keycloak:
  authServerUrl: ""
  realm: "online-beratung"
  config:
    adminUsername: ""
    adminPassword: ""
  jwt:
    issuerUri: ""
    jwkSetUri: ""

rabbitmq:
  host: ""
  port: 5672
  username: ""
  password: ""

services:
  tenantService:
    apiUrl: ""

spring:
  profiles:
    active: "local"

features:
  multitenancy:
    enabled: false
    withSingleDomain:
      enabled: true
    # Tenant-specific business value: subdomain of the main/default tenant.
    mainTenantSubdomain: "caritas-berlin"
