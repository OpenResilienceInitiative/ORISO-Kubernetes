# UserService Helm Chart - Values
#
# IMPORTANT: This file contains CHART DEFAULTS only.
# All URLs, hostnames and environment-specific values should be supplied
# by the umbrella values-prod.yaml via `global.*` keys. The templates in
# this chart prefer `.Values.global.*` and fall back to the values here.

# Application Configuration
image:
  repository: ghcr.io/openresilienceinitiative/oriso-userservice
  tag: rebuild
  pullPolicy: IfNotPresent

# Deployment Configuration
replicas: 1
# Empty -> templates fall back to .Release.Namespace
namespace: ""

# Extra pod labels merged into pod template metadata.
podLabels:
  tier: backend

resources:
  requests: {}
  limits: {}

livenessProbe: {}
readinessProbe: {}

# Service Configuration
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

# Database Configuration (MariaDB)
# In-cluster URL is built from global.services.mariadb.* by the configmap template.
database:
  url: ""
  username: ""
  password: ""
  liquibase:
    # Enabled so Spring Boot runs its bundled changesets on first boot
    # and creates the schema automatically in an empty database.
    enabled: false
    user: ""
    password: ""

# MongoDB Configuration
mongodb:
  uri: ""

# Keycloak Configuration
# Templates use global.keycloak.* when set; values here are fallback only.
keycloak:
  authServerUrl: ""
  realm: "online-beratung"
  config:
    adminUsername: ""
    adminPassword: ""
  jwt:
    issuerUri: ""
    jwkSetUri: ""
  identity:
    openIdConnectUrl: ""

# Matrix Configuration
# Templates use global.matrix.* when set; values here are fallback only.
matrix:
  apiUrl: ""
  serverName: ""
  migrationEnabled: true
  registrationSharedSecret: ""
  adminUsername: ""
  adminPassword: ""

# Privacy / Notification Preview Policy
privacy:
  notificationPreviewMode: "NONE"
  ipMode: "STANDARD"

# Redis (debug mirror only; does not affect DB services).
# Host is derived from global.services.redis.* in the configmap template.
redis:
  host: ""
  port: 6379
  secret:
    name: redis-secret
    key: password

# Debug feature flags
debug:
  redisMessageMirror:
    enabled: true
    ttlSeconds: 900
    maxBodyLength: 500
    keyPrefix: "debug:msgmirror"

# RabbitMQ Configuration
# Host is derived from global.services.rabbitmq.* in the configmap template.
rabbitmq:
  host: ""
  port: 5672
  username: ""
  password: ""

# Rocket.Chat Configuration (disabled until rocketchat is deployed)
rocketchat:
  baseUrl: ""
  mongoUrl: ""
  technical:
    username: ""
    password: ""
  systemuser:
    id: ""
    username: ""
    password: ""

# Service URLs (in-cluster). Templates prefer global.services.*.url.
services:
  tenantService:
    apiUrl: ""
  consultingTypeService:
    apiUrl: ""
  agencyService:
    apiUrl: ""

# Spring Profile
spring:
  profiles:
    active: "local"

# Application locale / timezone
app:
  locale: "de_DE"
  timezone: "Europe/Berlin"

# Feature Flags
features:
  multitenancy:
    enabled: true
    withSingleDomain:
      enabled: true

# Service Encryption
encryption:
  appKey: ""

# SMTP Configuration (mail infra integration)
smtp:
  host: ""
  port: "587"
  secure: "false"
  user: ""
  password: ""
  from: ""
