{{- /*
UserService ConfigMap
All connection URLs are resolved from .Values.global.* when set,
falling back to chart values. Credentials are NOT rendered here –
they live in the matching Secret and are mounted via envFrom.
*/ -}}
{{- $g          := .Values.global | default dict -}}
{{- $gSvc       := (default dict $g.services) -}}
{{- $gDom       := (default dict $g.domains) -}}
{{- $gMatrix    := (default dict $g.matrix) -}}
{{- $gKeycloak  := (default dict $g.keycloak) -}}
{{- $gKcJwt     := (default dict $gKeycloak.jwt) -}}

{{- /* In-cluster URLs */ -}}
{{- $mariadbHost  := (default "" (get (default dict $gSvc.mariadb)  "host")) -}}
{{- $mariadbPort  := (default 3306 (get (default dict $gSvc.mariadb)  "port")) -}}
{{- $mongoUri     := (default "" (get (default dict $gSvc.mongodb)  "uri")) -}}
{{- $redisHost    := (default "" (get (default dict $gSvc.redis)    "host")) -}}
{{- $redisPort    := (default 6379 (get (default dict $gSvc.redis)    "port")) -}}
{{- $rmqHost      := (default "" (get (default dict $gSvc.rabbitmq) "host")) -}}
{{- $rmqPort      := (default 5672 (get (default dict $gSvc.rabbitmq) "port")) -}}
{{- $tenantUrl    := (default "" (get (default dict $gSvc.tenantservice)         "url")) -}}
{{- $ctsUrl       := (default "" (get (default dict $gSvc.consultingtypeservice) "url")) -}}
{{- $agencyUrl    := (default "" (get (default dict $gSvc.agencyservice)         "url")) -}}
{{- $rcGlobal     := (default dict $gSvc.rocketchat) -}}
{{- $rcBaseG      := (default "" $rcGlobal.baseUrl) -}}
{{- $rcMongoG     := (default "" $rcGlobal.mongoUrl) -}}

{{- /* Final values (global preferred, fall back to local chart values) */ -}}
{{- $dbUrl     := default .Values.database.url (ternary (printf "jdbc:mariadb://%s:%v/userservice" $mariadbHost $mariadbPort) "" (ne $mariadbHost "")) -}}
{{- $mongoFull := default .Values.mongodb.uri  (ternary (printf "%s/userservice" $mongoUri) "" (ne $mongoUri "")) -}}
{{- $keycloakUrl  := default .Values.keycloak.authServerUrl  $gKeycloak.internalUrl -}}
{{- $keycloakRealm:= default .Values.keycloak.realm          $gKeycloak.realm -}}
{{- $jwtIssuer    := default .Values.keycloak.jwt.issuerUri  $gKcJwt.issuerUri -}}
{{- $jwtJwks      := default .Values.keycloak.jwt.jwkSetUri  $gKcJwt.jwkSetUri -}}
{{- $matrixUrl    := default .Values.matrix.apiUrl           $gMatrix.internalUrl -}}
{{- $matrixServer := default .Values.matrix.serverName       $gMatrix.serverName -}}
{{- $tenantFinal  := default .Values.services.tenantService.apiUrl         $tenantUrl -}}
{{- $ctsFinal     := default .Values.services.consultingTypeService.apiUrl $ctsUrl -}}
{{- $agencyFinal  := default .Values.services.agencyService.apiUrl         $agencyUrl -}}
{{- $rcBaseFinal  := default .Values.rocketchat.baseUrl  $rcBaseG -}}
{{- $rcMongoFinal := default .Values.rocketchat.mongoUrl $rcMongoG -}}
{{- $appHost      := default $g.domain $gDom.app -}}
{{- $apiHost      := default $g.domain $gDom.api -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "userservice.fullname" . }}-config
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "userservice.labels" . | nindent 4 }}
data:
  # ---- Connection URLs (no credentials!) ----
  SPRING_DATASOURCE_URL:                              {{ $dbUrl | quote }}
  SPRING_DATA_MONGODB_URI:                            {{ $mongoFull | quote }}
  KEYCLOAK_AUTH_SERVER_URL:                           {{ $keycloakUrl | quote }}
  KEYCLOAK_REALM:                                     {{ $keycloakRealm | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:  {{ $jwtIssuer | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: {{ $jwtJwks | quote }}
  IDENTITY_OPENID_CONNECT_URL: {{ printf "%s/realms/%s/protocol/openid-connect" $keycloakUrl $keycloakRealm | quote }}

  MATRIX_API_URL:                                     {{ $matrixUrl | quote }}
  MATRIX_SERVER_NAME:                                 {{ $matrixServer | quote }}
  MATRIX_MIGRATION_ENABLED:                           {{ .Values.matrix.migrationEnabled | quote }}

  PRIVACY_NOTIFICATION_PREVIEW_MODE:                  {{ .Values.privacy.notificationPreviewMode | quote }}
  PRIVACY_IP_MODE:                                    {{ .Values.privacy.ipMode | quote }}

  DEBUG_REDIS_MESSAGE_MIRROR_ENABLED:                 {{ .Values.debug.redisMessageMirror.enabled | quote }}
  DEBUG_REDIS_MESSAGE_MIRROR_TTL_SECONDS:             {{ .Values.debug.redisMessageMirror.ttlSeconds | quote }}
  DEBUG_REDIS_MESSAGE_MIRROR_MAX_BODY_LENGTH:         {{ .Values.debug.redisMessageMirror.maxBodyLength | quote }}
  DEBUG_REDIS_MESSAGE_MIRROR_KEY_PREFIX:              {{ .Values.debug.redisMessageMirror.keyPrefix | quote }}

  SPRING_REDIS_HOST:                                  {{ (default .Values.redis.host $redisHost) | quote }}
  SPRING_REDIS_PORT:                                  {{ $redisPort | quote }}

  SPRING_RABBITMQ_HOST:                               {{ (default .Values.rabbitmq.host $rmqHost) | quote }}
  SPRING_RABBITMQ_PORT:                               {{ $rmqPort | quote }}

  ROCKET_CHAT_BASE_URL:                               {{ $rcBaseFinal | quote }}
  ROCKET_CHAT_MONGO_URL:                              {{ $rcMongoFinal | quote }}

  TENANT_SERVICE_API_URL:                             {{ $tenantFinal | quote }}
  CONSULTING_TYPE_SERVICE_API_URL:                    {{ $ctsFinal | quote }}
  AGENCY_SERVICE_API_URL:                             {{ $agencyFinal | quote }}

  SMTP_HOST:  {{ .Values.smtp.host | quote }}
  SMTP_PORT:  {{ .Values.smtp.port | quote }}
  SMTP_SECURE: {{ .Values.smtp.secure | quote }}
  SMTP_FROM:  {{ .Values.smtp.from | quote }}

  SPRING_PROFILES_ACTIVE: {{ .Values.spring.profiles.active | quote }}

  MULTITENANCY_ENABLED: {{ .Values.features.multitenancy.enabled | quote }}
  FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED: {{ .Values.features.multitenancy.withSingleDomain.enabled | quote }}

  SPRING_LIQUIBASE_ENABLED: {{ .Values.database.liquibase.enabled | quote }}

  # Application Properties (Spring) – no passwords here; they come from envFrom secrets
  application.properties: |
    spring.application.name=user-service
    spring.profiles.active={{ .Values.spring.profiles.active }}
    spring.main.allow-bean-definition-overriding=true
    spring.jpa.open-in-view=true
    spring.jpa.hibernate.ddl-auto=none
    spring.data.jpa.repositories.bootstrap-mode=default
    spring.main.banner-mode=off
    spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

    server.port={{ .Values.service.targetPort }}
    server.host=https://{{ $apiHost }}
    app.base.url=https://{{ $apiHost }}

    server.tomcat.threads.max=1000
    server.tomcat.threads.min-spare=500
    server.tomcat.max-connections=5000
    server.tomcat.accept-count=1000
    server.tomcat.connection-timeout=30000

    spring.datasource.url={{ $dbUrl }}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
    spring.liquibase.enabled={{ .Values.database.liquibase.enabled }}

    spring.data.mongodb.uri={{ $mongoFull }}

    keycloak.auth-server-url={{ $keycloakUrl }}
    keycloak.realm={{ $keycloakRealm }}
    spring.security.oauth2.resourceserver.jwt.issuer-uri={{ $jwtIssuer }}
    spring.security.oauth2.resourceserver.jwt.jwk-set-uri={{ $jwtJwks }}
    identity.openid-connect-url={{ printf "%s/realms/%s/protocol/openid-connect" $keycloakUrl $keycloakRealm }}

    matrix.apiUrl={{ $matrixUrl }}
    matrix.serverName={{ $matrixServer }}
    matrix.migrationEnabled={{ .Values.matrix.migrationEnabled }}
    matrix.registrationSharedSecret=${MATRIX_REGISTRATION_SHARED_SECRET:}
    matrix.adminUsername=${MATRIX_ADMIN_USERNAME:}
    matrix.adminPassword=${MATRIX_ADMIN_PASSWORD:}

    debug.redis.message.mirror.enabled=${DEBUG_REDIS_MESSAGE_MIRROR_ENABLED:false}
    debug.redis.message.mirror.ttlSeconds=${DEBUG_REDIS_MESSAGE_MIRROR_TTL_SECONDS:900}
    debug.redis.message.mirror.maxBodyLength=${DEBUG_REDIS_MESSAGE_MIRROR_MAX_BODY_LENGTH:500}
    debug.redis.message.mirror.keyPrefix=${DEBUG_REDIS_MESSAGE_MIRROR_KEY_PREFIX:debug:msgmirror}
    spring.redis.host=${SPRING_REDIS_HOST:}
    spring.redis.port=${SPRING_REDIS_PORT:6379}
    spring.redis.password=${SPRING_REDIS_PASSWORD:}
    privacy.notificationPreviewMode=${PRIVACY_NOTIFICATION_PREVIEW_MODE:NONE}
    privacy.ipMode=${PRIVACY_IP_MODE:STANDARD}

    spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:}
    spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
    spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
    spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}

    rocket-chat.base-url={{ $rcBaseFinal }}
    rocket-chat.mongo-url={{ $rcMongoFinal }}
    rocket.technical.username=${ROCKET_TECHNICAL_USERNAME:}
    rocket.technical.password=${ROCKET_TECHNICAL_PASSWORD:}

    tenant.service.api.url={{ $tenantFinal }}
    consulting.type.service.api.url={{ $ctsFinal }}
    agency.service.api.url={{ $agencyFinal }}
    agency.service.api.get.agencies=${agency.service.api.url}/
    agency.admin.service.api.url=${app.base.url}

    smtp.host={{ .Values.smtp.host }}
    smtp.port={{ .Values.smtp.port }}
    smtp.secure={{ .Values.smtp.secure }}
    smtp.user=${SMTP_USER:}
    smtp.password=${SMTP_PASSWORD:}
    smtp.from={{ .Values.smtp.from }}

    registration.cors.allowed.origins=https://{{ $appHost }},https://{{ .Values.global.domains.admin }}
    registration.cors.allowed.paths=/service/users/askers/new,/service/users/consultants/languages

    spring.web.locale={{ .Values.app.locale }}
    spring.jackson.time-zone={{ .Values.app.timezone }}
    multitenancy.enabled={{ .Values.features.multitenancy.enabled }}
    feature.multitenancy.with.single.domain.enabled={{ .Values.features.multitenancy.withSingleDomain.enabled }}
    service.encryption.appkey=${SERVICE_ENCRYPTION_APPKEY:}

