{{- /*
AgencyService ConfigMap.
All URLs come from .Values.global.* when set; fallback to local chart values.
Credentials are NOT rendered here – use the Secret.
*/ -}}
{{- $g    := .Values.global | default dict -}}
{{- $gSvc := (default dict $g.services) -}}
{{- $gKc  := (default dict $g.keycloak) -}}
{{- $gJwt := (default dict $gKc.jwt) -}}
{{- $gMx  := (default dict $g.matrix) -}}
{{- $mariaHost := (default "" (get (default dict $gSvc.mariadb) "host")) -}}
{{- $mariaPort := (default 3306 (get (default dict $gSvc.mariadb) "port")) -}}
{{- $mongoUri  := (default "" (get (default dict $gSvc.mongodb) "uri")) -}}
{{- $tenantUrl := (default "" (get (default dict $gSvc.tenantservice) "url")) -}}
{{- $ctsUrl    := (default "" (get (default dict $gSvc.consultingtypeservice) "url")) -}}
{{- $userUrl   := (default "" (get (default dict $gSvc.userservice) "url")) -}}
{{- $dbUrl     := default .Values.database.url (ternary (printf "jdbc:mariadb://%s:%v/agencyservice" $mariaHost $mariaPort) "" (ne $mariaHost "")) -}}
{{- $mongoFull := default .Values.mongodb.uri  (ternary (printf "%s/agencyservice" $mongoUri) "" (ne $mongoUri "")) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agencyservice.fullname" . }}-config
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "agencyservice.labels" . | nindent 4 }}
data:
  SPRING_DATASOURCE_URL: {{ $dbUrl | quote }}

  KEYCLOAK_AUTH_SERVER_URL: {{ default .Values.keycloak.authServerUrl $gKc.internalUrl | quote }}
  KEYCLOAK_REALM:           {{ default .Values.keycloak.realm          $gKc.realm | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:  {{ default .Values.keycloak.jwt.issuerUri  $gJwt.issuerUri  | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: {{ default .Values.keycloak.jwt.jwkSetUri $gJwt.jwkSetUri | quote }}

  SPRING_DATA_MONGODB_URI: {{ $mongoFull | quote }}

  MATRIX_API_URL:     {{ default .Values.matrix.apiUrl     $gMx.internalUrl | quote }}
  MATRIX_SERVER_NAME: {{ default .Values.matrix.serverName $gMx.serverName  | quote }}

  CONSULTING_TYPE_SERVICE_API_URL: {{ default .Values.services.consultingTypeService.apiUrl $ctsUrl    | quote }}
  TENANT_SERVICE_API_URL:          {{ default .Values.services.tenantService.apiUrl         $tenantUrl | quote }}
  USER_ADMIN_SERVICE_API_URL:      {{ default .Values.services.userAdminService.apiUrl      $userUrl   | quote }}
  LIVE_SERVICE_API_URL:            {{ .Values.services.liveService.apiUrl        | quote }}
  APPOINTMENT_SERVICE_API_URL:     {{ .Values.services.appointmentService.apiUrl | quote }}
  CSRF_HEADER_PROPERTY: {{ .Values.csrf.headerProperty | quote }}
  CSRF_WHITELIST_HEADER_PROPERTY: {{ .Values.csrf.whitelistHeaderProperty | quote }}

  ROCKET_CHAT_BASE_URL:  {{ .Values.rocketchat.baseUrl  | quote }}
  ROCKET_CHAT_MONGO_URL: {{ .Values.rocketchat.mongoUrl | quote }}

  FEATURE_TOPICS_ENABLED: {{ .Values.features.topics.enabled | quote }}
  MULTITENANCY_ENABLED:   {{ .Values.features.multitenancy.enabled | quote }}
  FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED: {{ .Values.features.multitenancy.withSingleDomain.enabled | quote }}

  SPRING_PROFILES_ACTIVE:   {{ .Values.spring.profiles.active | quote }}
  SPRING_LIQUIBASE_ENABLED: {{ .Values.database.liquibase.enabled | quote }}
