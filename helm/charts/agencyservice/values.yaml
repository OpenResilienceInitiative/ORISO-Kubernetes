# AgencyService Helm Chart - Values
#
# IMPORTANT: This file contains CHART DEFAULTS only.
# All URLs and environment-specific values should be supplied by the
# umbrella values-prod.yaml via `global.*` keys.

image:
  repository: ghcr.io/openresilienceinitiative/oriso-agencyservice
  tag: rebuild
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

podLabels:
  tier: backend

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 120
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 60
  periodSeconds: 10

service:
  type: ClusterIP
  port: 8084
  targetPort: 8084

# Database Configuration (MariaDB) – URL built from global.services.mariadb.*
database:
  url: ""
  username: ""
  password: ""
  driver: "org.mariadb.jdbc.Driver"
  hikari:
    maximumPoolSize: 10
    minimumIdle: 8
    idleTimeout: 500000
    maxLifetime: 500000
  hibernate:
    dialect: "org.hibernate.dialect.MariaDB103Dialect"
    showSql: true
    formatSql: true
    ddlAuto: "validate"
  liquibase:
    # Enabled so Spring Boot runs its bundled changesets on first boot
    # and creates the schema automatically in an empty database.
    enabled: false

# MongoDB – URI built from global.services.mongodb.uri
mongodb:
  uri: ""

# Keycloak – templates prefer global.keycloak.*
keycloak:
  authServerUrl: ""
  realm: "online-beratung"
  bearerOnly: true
  resource: "agency-service"
  principalAttribute: "preferred_username"
  cors: false
  sslRequired: "none"
  config:
    adminUsername: ""
    adminPassword: ""
    adminClientId: "admin-cli"
    appClientId: "app"
  jwt:
    issuerUri: ""
    jwkSetUri: ""

# Matrix Synapse – templates prefer global.matrix.*
matrix:
  apiUrl: ""
  registrationSharedSecret: ""
  serverName: ""
  adminUsername: ""
  adminPassword: ""

# Service URLs – derived from global.services.*
services:
  consultingTypeService:
    apiUrl: ""
  tenantService:
    apiUrl: ""
  userAdminService:
    apiUrl: ""
  liveService:
    apiUrl: ""
  appointmentService:
    apiUrl: ""

# Rocket.Chat (disabled until rocketchat is deployed)
rocketchat:
  baseUrl: ""
  mongoUrl: ""
  technical:
    username: ""
    password: ""
  credentialCron: "0 0 * * * ?"

features:
  topics:
    enabled: true
  multitenancy:
    enabled: true
    withSingleDomain:
      enabled: true

spring:
  profiles:
    active: "local"
