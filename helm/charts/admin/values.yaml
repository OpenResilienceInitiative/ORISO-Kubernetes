# Admin Helm Chart - Values
# All values from ACTUAL running cluster resources

# Application Configuration
image:
  repository: ghcr.io/openresilienceinitiative/caritas-admin
  tag: rebuild
  pullPolicy: IfNotPresent  # Use local image from k3s

# Deployment Configuration
replicas: 1
namespace: ""

# Extra pod labels merged into pod template metadata.
podLabels:
  tier: frontend

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /admin
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /admin
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 1

# Service Configuration
service:
  type: LoadBalancer
  port: 9000
  targetPort: 80

# Environment Variables.
# All REACT_APP_* / VITE_* URLs are rendered by the deployment template
# from .Values.global.domains.*. Only non-URL env vars belong here.
env: {}
