# OTEL Collector Helm Chart - Values
# Forwards metrics to SigNoz

image:
  repository: otel/opentelemetry-collector
  tag: "0.100.0"
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

# SigNoz Configuration. Templates derive endpoint from
# .Values.global.services.signoz.host:port; falls back to value below
# only if no global is set. SigNoz receives OTLP on port 8080.
signoz:
  endpoint: ""

service:
  type: ClusterIP
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    metrics: 8888

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

