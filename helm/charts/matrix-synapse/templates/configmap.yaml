{{- $g       := .Values.global | default dict -}}
{{- $gMx     := default dict $g.matrix -}}
{{- $gSvc    := default dict $g.services -}}
{{- $gRedis  := default dict $gSvc.redis -}}
{{- $serverName := default $gMx.serverName .Values.matrix.serverName -}}
{{- if eq $serverName "" -}}
{{- $serverName = default "" $g.domain -}}
{{- end -}}
{{- $publicBaseUrl := default $gMx.publicUrl .Values.matrix.publicBaseUrl -}}
{{- if eq $publicBaseUrl "" -}}
{{- $publicBaseUrl = printf "https://matrix.%s" (default "" $g.domain) -}}
{{- end -}}
{{- $redisHost := default "redis" $gRedis.host -}}
{{- $redisPort := default 6379 $gRedis.port -}}
{{- $redisPassword := default "" .Values.matrix.redisPassword -}}
{{- $regSecret := default "" .Values.matrix.registrationSharedSecret -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-homeserver-oidc
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "matrix-synapse.labels" . | nindent 4 }}
data:
  homeserver.yaml: |
    server_name: "{{ $serverName }}"
    pid_file: /data/homeserver.pid

    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        bind_addresses: ["0.0.0.0"]
        resources:
          - names: [client, federation]
            compress: false

    database:
      name: sqlite3
      args:
        database: /data/homeserver.db

    redis:
      enabled: true
      host: {{ $redisHost | quote }}
      port: {{ $redisPort }}
      password: {{ $redisPassword | quote }}
      dbid: 0

    caches:
      global_factor: 1.0
      per_cache_factors:
        get_users_in_room: 10.0
        get_remote_users_in_room: 10.0

    media_store_path: /data/media_store

    enable_authenticated_media: false
    matrix_synapse_enable_authenticated_media: false

    registration_shared_secret: {{ $regSecret | quote }}
    report_stats: false
    enable_registration: true
    enable_registration_without_verification: true
    public_baseurl: {{ $publicBaseUrl | quote }}

    suppress_key_validation_warnings: true
    trusted_key_servers:
      - server_name: "matrix.org"
        accept_keys_insecurely: true

    turn_uris:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"
    turn_allow_guests: true

    rc_message:
      per_second: 100000
      burst_count: 100000
    rc_registration:
      per_second: 100000
      burst_count: 100000
    rc_login:
      address:
        per_second: 100000
        burst_count: 100000
      account:
        per_second: 100000
        burst_count: 100000
      failed_attempts:
        per_second: 100000
        burst_count: 100000
    rc_admin_redaction:
      per_second: 100000
      burst_count: 100000
    rc_joins:
      local:
        per_second: 100000
        burst_count: 100000
      remote:
        per_second: 100000
        burst_count: 100000
    rc_3pid_validation:
      per_second: 100000
      burst_count: 100000
    rc_invites:
      per_room:
        per_second: 100000
        burst_count: 100000
      per_user:
        per_second: 100000
        burst_count: 100000

    exempt_from_ratelimiting:
      - "10.42.0.0/16"
      - "127.0.0.1"

    experimental_features:
      msc3575_enabled: true
      msc3575_for_workers: true
