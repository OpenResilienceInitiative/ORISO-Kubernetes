# Matrix Synapse Helm Chart - Values
# Based on actual running deployment

image:
  repository: matrixdotorg/synapse
  tag: "latest"
  pullPolicy: Always

replicas: 1
namespace: ""

service:
  type: ClusterIP
  port: 8008
  targetPort: 8008
  federationPort: 8009

# Matrix Configuration
matrix:
  # Server name. Falls back to global.matrix.serverName, then global.domain.
  serverName: ""
  # Public homeserver URL. Falls back to global.matrix.publicUrl,
  # then https://matrix.<global.domain>.
  publicBaseUrl: ""
  reportStats: "no"
  enableAuthenticatedMedia: "false"
  # Redis password Synapse uses. Set this in values-prod-secrets.yaml to
  # match the running Redis instance.
  redisPassword: ""
  # Registration shared secret. Must match the agencyservice / userservice
  # MATRIX_REGISTRATION_SHARED_SECRET so they can register Matrix users.
  registrationSharedSecret: ""

# Storage Configuration
persistence:
  enabled: true
  storageClass: "local-path"
  size: 10Gi
  accessMode: ReadWriteOnce
  existingClaim: "matrix-synapse-data"  # Use existing PVC

# ConfigMap for homeserver.yaml.
# The chart now ships its own templates/configmap.yaml that creates this,
# so `existing: false` (chart-managed) is the right default.
# Set `existing: true` only if you manage the ConfigMap out-of-band.
configMap:
  name: matrix-homeserver-oidc
  existing: true

resources:
  requests:
    cpu: 1500m
    memory: 3Gi
  limits:
    cpu: "3"
    memory: 6Gi

# Probes
livenessProbe:
  httpGet:
    path: /_matrix/client/versions
    port: 8008
    scheme: HTTP
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /_matrix/client/versions
    port: 8008
    scheme: HTTP
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

# Init Container for permissions fix
initContainer:
  enabled: true
  image: busybox:latest
  runAsUser: 0

# Security Context
securityContext:
  fsGroup: 991
  runAsUser: 991
  runAsGroup: 991


