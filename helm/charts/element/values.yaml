# Element Helm Chart - Values
# Based on actual running deployment

image:
  repository: ghcr.io/openresilienceinitiative/oriso-element
  tag: rebuild
  pullPolicy: Never  # Use local image (must exist)

replicas: 1
namespace: ""

service:
  type: ClusterIP
  port: 8087
  targetPort: 8087

resources: {}  # No limits set in original

# Network Configuration
hostNetwork: false

