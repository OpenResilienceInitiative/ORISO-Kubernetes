# TenantService Helm Chart - Values
#
# IMPORTANT: This file contains CHART DEFAULTS only.
# All URLs and environment-specific values should be supplied by the
# umbrella values-prod.yaml via `global.*` keys. Templates prefer
# `.Values.global.*` and fall back to the values here.

# Application Configuration
image:
  repository: ghcr.io/openresilienceinitiative/oriso-tenantservice
  tag: rebuild
  pullPolicy: IfNotPresent

replicas: 1
namespace: ""

podLabels:
  tier: backend

resources:
  requests: {}
  limits: {}

livenessProbe: {}
readinessProbe: {}

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

# Database Configuration (MariaDB) – URL built from global.services.mariadb.*
database:
  url: ""
  username: ""
  password: ""
  driver: "org.mariadb.jdbc.Driver"
  hikari:
    maximumPoolSize: 10
    minimumIdle: 8
    idleTimeout: 500000
    maxLifetime: 500000
  hibernate:
    dialect: "org.hibernate.dialect.MariaDB103Dialect"
    showSql: true
    formatSql: true
    ddlAuto: "validate"
  liquibase:
    # Enabled so Spring Boot runs its bundled changesets on first boot
    # and creates the schema automatically in an empty database.
    enabled: false

# Keycloak – Templates use global.keycloak.* when set; values here are fallback.
keycloak:
  authServerUrl: ""
  realm: "online-beratung"
  bearerOnly: true
  resource: "tenant-service"
  principalAttribute: ""
  cors: true
  sslRequired: "none"
  jwt:
    issuerUri: ""
    jwkSetUri: ""

# RabbitMQ – host derived from global.services.rabbitmq.*
rabbitmq:
  host: ""
  port: 5672
  username: ""
  password: ""

# Service URLs – derived from global.services.*
services:
  consultingTypeService:
    apiUrl: ""
  userService:
    apiUrl: ""

spring:
  profiles:
    active: "local"

features:
  multitenancy:
    enabled: true
    withSingleDomain:
      enabled: true
