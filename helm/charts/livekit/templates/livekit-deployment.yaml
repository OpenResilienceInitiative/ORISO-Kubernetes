apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livekit.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.namespace }}
  labels:
    {{- include "livekit.main.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: {{ .Values.livekit.enableServiceLinks | default false }}
      containers:
      - name: livekit
        image: "{{ .Values.livekit.image.repository }}:{{ .Values.livekit.image.tag }}"
        imagePullPolicy: {{ .Values.livekit.image.pullPolicy }}
        args:
        - --config
        - /etc/livekit/livekit.yaml
        ports:
        - name: http
          containerPort: {{ .Values.livekit.service.targetPort }}
          protocol: TCP
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit
          readOnly: true
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      volumes:
      - name: livekit-config
        configMap:
          name: {{ include "livekit.fullname" . }}-config
      terminationGracePeriodSeconds: 30

