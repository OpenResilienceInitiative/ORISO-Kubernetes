# LiveKit Helm Chart - Values
# Based on actual running services

# LiveKit Main Service
livekit:
  image:
    repository: livekit/livekit-server
    tag: "latest"
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  service:
    type: ClusterIP
    port: 7880
    targetPort: 7880

# LiveKit Token Service
tokenService:
  image:
    repository: livekit-token-service
    tag: "latest"
    pullPolicy: Never  # Use local image
  
  replicas: 1

  # Returned in SFU JWT responses as { url, jwt } — must be the public
  # LiveKit websocket host (wss://), not the JWT service path.
  env:
    LIVEKIT_URL: "wss://livekit.oriso-dev.site"
  
  service:
    type: ClusterIP
    port: 3010
    targetPort: 3010

namespace: caritas

resources: {}  # No limits set in original



