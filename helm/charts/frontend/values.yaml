# Frontend Helm Chart - Values
# All values from ACTUAL running cluster resources

# Application Configuration
image:
  repository: ghcr.io/openresilienceinitiative/caritas-frontend
  tag: rebuild
  pullPolicy: Never  # Use local image from k3s

# Deployment Configuration
replicas: 1
namespace: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 1

# Service Configuration
service:
  type: LoadBalancer
  port: 9001
  targetPort: 80

# Environment Variables.
# All REACT_APP_* / VITE_* URLs are rendered by the deployment template
# from .Values.global.domains.*. Only non-URL env vars belong here.
env:
  NODE_ENV: "production"
  PORT: "80"
