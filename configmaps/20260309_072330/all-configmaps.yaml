- apiVersion: v1
  data:
    service-health-exporter.py: "#!/usr/bin/env python3\n\"\"\"\nCaritas Service Health
      Monitor - Exports to SigNoz via OTEL Collector\nUses OpenTelemetry OTLP format
      (correct way)\n\"\"\"\nimport requests\nimport time\nimport os\nfrom opentelemetry
      import metrics\nfrom opentelemetry.sdk.metrics import MeterProvider\nfrom opentelemetry.sdk.metrics.export
      import PeriodicExportingMetricReader\nfrom opentelemetry.exporter.otlp.proto.http
      import OTLPMetricExporter\nfrom opentelemetry.sdk.resources import Resource\n\n#
      Get configuration from environment\nOTEL_ENDPOINT = os.getenv(\"OTEL_ENDPOINT\",
      \"http://oriso-platform-otel-collector.caritas.svc.cluster.local:4318\")\nCHECK_INTERVAL
      = int(os.getenv(\"CHECK_INTERVAL\", \"10\"))\nTIMEOUT = int(os.getenv(\"TIMEOUT\",
      \"5\"))\nprint(f\"Using OTEL endpoint: {OTEL_ENDPOINT}\")\n\n# Configure OTEL\nresource
      = Resource.create({\"service.name\": \"caritas-health-monitor\"})\nexporter
      = OTLPHTTPMetricExporter(endpoint=OTEL_ENDPOINT)\nreader = PeriodicExportingMetricReader(exporter,
      export_interval_millis=CHECK_INTERVAL * 1000)\nprovider = MeterProvider(resource=resource,
      metric_readers=[reader])\nmetrics.set_meter_provider(provider)\n\nmeter = metrics.get_meter(\"caritas.monitoring\")\n\n#
      Create metrics\nservice_up = meter.create_up_down_counter(\n    \"service.up\",\n
      \   description=\"Service availability (1=up, 0=down)\"\n)\nresponse_time =
      meter.create_histogram(\n    \"service.response_time\",\n    unit=\"ms\",\n
      \   description=\"Service response time in milliseconds\"\n)\n\n# Services configuration\nSERVICES
      = {\n    \"agencyservice\": {\n        \"url\": \"http://oriso-platform-agencyservice.caritas.svc.cluster.local:8084/actuator/health\",\n
      \       \"port\": 8084\n    },\n    \"consultingtypeservice\": {\n        \"url\":
      \"http://oriso-platform-consultingtypeservice.caritas.svc.cluster.local:8083/actuator/health\",\n
      \       \"port\": 8083\n    },\n    \"tenantservice\": {\n        \"url\": \"http://oriso-platform-tenantservice.caritas.svc.cluster.local:8081/actuator/health\",\n
      \       \"port\": 8081\n    },\n    \"userservice\": {\n        \"url\": \"http://oriso-platform-userservice.caritas.svc.cluster.local:8082/actuator/health\",\n
      \       \"port\": 8082\n    },\n}\n\ndef check_service(name, config):\n    try:\n
      \       start = time.time()\n        response = requests.get(config[\"url\"],
      timeout=TIMEOUT)\n        duration = (time.time() - start) * 1000\n        \n
      \       status = 1 if response.status_code == 200 else 0\n        \n        attributes
      = {\n            \"service.name\": name,\n            \"service.port\": str(config[\"port\"]),\n
      \           \"http.status_code\": str(response.status_code)\n        }\n        \n
      \       service_up.add(status, attributes)\n        response_time.record(duration,
      attributes)\n        \n        print(f\"✓ {name}: {response.status_code} ({duration:.2f}ms)\")\n
      \       \n    except Exception as e:\n        attributes = {\n            \"service.name\":
      name,\n            \"service.port\": str(config[\"port\"]),\n            \"error\":
      \"true\"\n        }\n        service_up.add(0, attributes)\n        print(f\"✗
      {name}: DOWN ({str(e)})\")\n\nprint(\"\U0001F50D Caritas Health Monitor for
      SigNoz\")\nprint(f\"Monitoring {len(SERVICES)} services and sending to {OTEL_ENDPOINT}...\")\nprint(\"=\"
      * 60)\n\nwhile True:\n    for service_name, service_config in SERVICES.items():\n
      \       check_service(service_name, service_config)\n    print(\"-\" * 60)\n
      \   time.sleep(CHECK_INTERVAL)\n"
